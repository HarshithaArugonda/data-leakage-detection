[project]
name = "data-leakage-detection"
version = "0.1.0"
description = "Data leakage detection for LLM agents: PII/secret DLP, prompt-injection defense, and tool-call policy."
readme = "README.md"
authors = [{ name = "Harshitha Arugonda" }]
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.1.0",
    "en-core-web-lg",
    "huggingface-hub>=2.3.0",
    "presidio-analyzer>=2.2.364",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
models = []

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src", "eval"]
