# Data Leakage Detection policy.
# Each detected entity type maps to one action:
#   allow - leave it in the text
#   mask  - replace with a placeholder like <EMAIL_ADDRESS_1>
#   block - reject the whole message
# If any entity in a message is "block", the whole message is blocked.
# Tool allow-lists and roles get added here on Day 3 (tool-call proxy).

version: 1

# Action for entity types that are detected but not listed below.
default_action: mask

# Findings below this score are ignored, whatever layer produced them.
min_score: 0.5

presidio:
  enabled: true
  # spaCy NER model behind Presidio. en_core_web_sm is smaller but tags
  # words like "Python" as LOCATION, so lg is used everywhere, CI included.
  # Override with $DLD_SPACY_MODEL.
  spacy_model: en_core_web_lg
  score_threshold: 0.5

entities:
  # --- Secrets and credentials: never let these through ---
  PRIVATE_KEY: block
  AWS_ACCESS_KEY: block
  GITHUB_TOKEN: block
  ANTHROPIC_API_KEY: block
  OPENAI_API_KEY: block
  SLACK_TOKEN: block
  GOOGLE_API_KEY: block
  STRIPE_KEY: block
  JWT: block
  BEARER_TOKEN: block
  PASSWORD: block
  GENERIC_SECRET: block

  # --- High-risk PII: block ---
  US_SSN: block
  CREDIT_CARD: block
  US_BANK_NUMBER: block
  IBAN_CODE: block
  US_PASSPORT: block

  # --- Contact / identity PII: mask so the request can still go through ---
  EMAIL_ADDRESS: mask
  PHONE_NUMBER: mask
  PERSON: mask
  LOCATION: mask
  IP_ADDRESS: mask
  US_DRIVER_LICENSE: mask

  # --- Usually harmless on their own ---
  DATE_TIME: allow
  URL: allow
  NRP: allow   # nationality / religious / political group
