# entity type -> allow / mask / block
# one "block" entity blocks the whole message

version: 1

default_action: mask  # for types not listed below
min_score: 0.5

presidio:
  enabled: true
  # sm model tagged "Python" as a LOCATION, so lg everywhere (CI too)
  spacy_model: en_core_web_lg
  score_threshold: 0.5

entities:
  # secrets
  PRIVATE_KEY: block
  AWS_ACCESS_KEY: block
  GITHUB_TOKEN: block
  ANTHROPIC_API_KEY: block
  OPENAI_API_KEY: block
  SLACK_TOKEN: block
  GOOGLE_API_KEY: block
  STRIPE_KEY: block
  JWT: block
  BEARER_TOKEN: block
  PASSWORD: block
  GENERIC_SECRET: block

  # high-risk PII
  US_SSN: block
  CREDIT_CARD: block
  US_BANK_NUMBER: block
  IBAN_CODE: block
  US_PASSPORT: block

  # contact/identity info: mask so the request still goes through
  EMAIL_ADDRESS: mask
  PHONE_NUMBER: mask
  PERSON: mask
  LOCATION: mask
  IP_ADDRESS: mask
  US_DRIVER_LICENSE: mask

  # usually harmless on its own
  DATE_TIME: allow
  URL: allow
  NRP: allow   # nationality / religious / political group
